name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, such as v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Job-level so the publish steps can test for them; step env is not visible to a step's own `if`.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -- --production
      - run: npm test
      - run: npx vsce package --no-dependencies -o "threadside-${TAG#v}.vsix"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" threadside-*.vsix --clobber
          else
            gh release create "$TAG" threadside-*.vsix --title "$TAG" --notes-file CHANGELOG.md
          fi
      - name: Publish to Open VSX (Cursor, VSCodium, Windsurf)
        if: env.OVSX_PAT != ''
        run: npx -y ovsx@0.10 publish threadside-*.vsix --skip-duplicate
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath threadside-*.vsix --skip-duplicate
